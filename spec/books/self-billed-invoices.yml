openapi: 3.0.0
info:
  title: Self-Billed Invoices
  description: A self-billed invoice is a document issued by the buyer on behalf of the supplier, used when the supplier is unable to raise an invoice themselves.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.com/books/v3
    description: API Endpoint
tags:
  - name: self-billed-invoices
    description: Self-Billed Invoices Module
paths:
  /bills:
    x-mcp-group:
      - Self-Billed Invoices
    x-node_available_in:
      - uae
    post:
      tags:
        - self-billed-invoices
      operationId: create_self_billed_invoice
      summary: Create a Self-Billed Invoice
      description: Create a new self-billed invoice. Set <code>entity_type</code> to <code>self_billed_invoice</code> to identify it as a self-billed invoice.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-self-billed-invoice-request'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-self-billed-invoice-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.CREATE
    get:
      tags:
        - self-billed-invoices
      operationId: list_self_billed_invoices
      summary: List Self-Billed Invoices
      description: Retrieve a paginated list of self-billed invoices. Use the <code>entity_type=self_billed_invoice</code> query parameter to filter self-billed invoices only.
      parameters:
        - name: entity_type
          in: query
          required: false
          description: Filter by entity type. Use <code>self_billed_invoice</code> to list only self-billed invoices.
          schema:
            type: string
          example: self_billed_invoice
        - name: bill_number
          in: query
          required: false
          description: Filter by bill number.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 'Filter by status. Allowed values: <code>draft</code>, <code>open</code>, <code>paid</code>, <code>overdue</code>, <code>void</code>.'
          schema:
            type: string
        - name: date_start
          in: query
          required: false
          description: 'Filter invoices with a bill date on or after this date. Format: yyyy-mm-dd.'
          schema:
            type: string
            format: date
        - name: date_end
          in: query
          required: false
          description: 'Filter invoices with a bill date on or before this date. Format: yyyy-mm-dd.'
          schema:
            type: string
            format: date
        - name: vendor_name
          in: query
          required: false
          description: Filter by vendor name.
          schema:
            type: string
        - name: sort_column
          in: query
          required: false
          description: 'Column to sort the list by. Allowed values: <code>vendor_name</code>, <code>bill_number</code>, <code>date</code>, <code>due_date</code>, <code>total</code>, <code>balance</code>.'
          schema:
            type: string
        - name: sort_order
          in: query
          required: false
          description: 'Sort order. Allowed values: <code>A</code> (ascending), <code>D</code> (descending).'
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination.
          schema:
            type: integer
          example: 1
        - name: per_page
          in: query
          required: false
          description: 'Number of records per page. Default: 25.'
          schema:
            type: integer
          example: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-self-billed-invoices-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bills/{bill_id}:
    x-mcp-group:
      - Self-Billed Invoices
    x-node_available_in:
      - uae
    put:
      tags:
        - self-billed-invoices
      operationId: update_self_billed_invoice
      summary: Update a Self-Billed Invoice
      description: Update the details of an existing self-billed invoice.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-self-billed-invoice-request'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-self-billed-invoice-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.UPDATE
    get:
      tags:
        - self-billed-invoices
      operationId: get_self_billed_invoice
      summary: Get a Self-Billed Invoice
      description: Fetch the details of a self-billed invoice.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-a-self-billed-invoice-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.READ
    delete:
      tags:
        - self-billed-invoices
      operationId: delete_self_billed_invoice
      summary: Delete a Self-Billed Invoice
      description: Delete an existing self-billed invoice.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-self-billed-invoice-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.DELETE
    parameters:
      - name: bill_id
        in: path
        required: true
        description: 'Unique identifier of the self-billed invoice. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: '982000000567301'
      - $ref: '#/components/parameters/organization_id'
  /selfbilledinvoices/{bill_id}/einvoice/push:
    x-mcp-group:
      - Self-Billed Invoices
    x-node_available_in:
      - uae
    post:
      tags:
        - self-billed-invoices
      operationId: push_self_billed_invoice_einvoice
      summary: Push a self-billed invoice e-invoice
      description: Push the e-invoice of a self-billed invoice.<br><b>Rate limit:</b> 150 requests per minute. Exceeding this limit triggers a 30-minute lock-out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/push-self-billed-invoice-einvoice-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.bills.CREATE
    parameters:
      - name: bill_id
        in: path
        required: true
        description: 'Unique identifier of the self-billed invoice. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: '982000000567301'
      - $ref: '#/components/parameters/organization_id'
components:
  parameters:
    organization_id:
      name: organization_id
      in: query
      required: true
      description: 'ID of the organization. Note: This value is a set of numeric characters.'
      schema:
        type: string
      example: '10234695'
  schemas:
    create-a-self-billed-invoice-request:
      type: object
      required:
        - bill_number
        - vendor_id
        - line_items
        - entity_type
      properties:
        bill_number:
          type: string
          description: 'Unique bill number for the self-billed invoice. Maximum length: 50 characters.'
          example: B-001982
          maxLength: 50
        vendor_id:
          type: string
          description: 'Unique identifier of the vendor (supplier on whose behalf the invoice is raised). Note: This value is a set of numeric characters.'
          example: '86067000000227074'
        reference_number:
          type: string
          description: Reference number for the self-billed invoice.
          example: REF-001
        date:
          type: string
          description: 'Date of the self-billed invoice. Format: yyyy-mm-dd.'
          format: date
          example: '2026-09-23'
        due_date:
          type: string
          description: 'Due date for payment. Format: yyyy-mm-dd.'
          format: date
          example: '2026-09-23'
        terms:
          type: string
          description: 'Payment terms notes for the self-billed invoice. Maximum length: 10000 characters.'
          example: Net 30
          maxLength: 10000
        adjustment:
          type: number
          description: Adjustment amount applied to the total.
          example: 0
        adjustment_description:
          type: string
          description: 'Description for the adjustment amount. Maximum length: 100 characters.'
          example: Adjustment
          maxLength: 100
        is_draft:
          type: boolean
          description: Set to <code>true</code> to save the self-billed invoice as a draft.
          example: false
        pricebook_id:
          type: string
          description: 'Unique identifier of the price book to apply. Note: This value is a set of numeric characters.'
          example: ''
        is_item_level_tax_calc:
          type: boolean
          description: Set to <code>true</code> to calculate tax at the line-item level.
          example: false
        is_inclusive_tax:
          type: boolean
          description: Set to <code>true</code> if the line-item rates are inclusive of tax.
          example: false
        discount:
          type: number
          description: Entity-level discount applied to the subtotal.
          example: 0
        discount_code:
          type: string
          maxLength: 200
          description: 'Discount reason code for the entity-level discount. Maximum length: 200 characters.'
          example: special_agreement
          x-node_available_in:
            - uae
        discount_account_id:
          type: string
          description: 'Unique identifier of the account to post the discount amount. Note: This value is a set of numeric characters.'
          example: '86067000000072001'
        discount_type:
          type: string
          description: 'Level at which the discount is applied. Allowed values: <code>entity_level</code>, <code>item_level</code>.'
          example: entity_level
        is_discount_before_tax:
          type: boolean
          description: Set to <code>true</code> to apply the discount before tax calculation.
          example: true
        payment_terms:
          type: integer
          description: Number of days within which payment is due.
          example: 0
        payment_terms_label:
          type: string
          description: Label for the payment terms (e.g., Net 30).
          example: Due on Receipt
        payment_mode:
          type: string
          description: 'Mode of payment expected from the buyer. Allowed values: <code>cash</code>, <code>cheque</code>, <code>bank_transfer</code>, <code>sepa_credit_transfer</code>, <code>debit_transfer</code>, <code>card</code>, <code>not_specified</code>, <code>bankers_draft</code>, <code>credit_transfer</code>, <code>direct_debit</code>, <code>sepa_direct_debit</code>, <code>bank_cheque</code>, <code>credit_card</code>, <code>debit_card</code>, <code>online_payment_service</code>.'
          example: cash
          x-node_available_in:
            - uae
        bank_account_id:
          type: string
          description: 'Unique identifier of the bank account for the expected payment. Note: This value is a set of numeric characters.'
          example: '86067000000034003'
          x-node_available_in:
            - uae
        account_id:
          type: string
          description: 'Unique identifier of the expense account for the bill. Note: This value is a set of numeric characters.'
          example: '86067000000000373'
        template_id:
          type: string
          description: 'Unique identifier of the PDF template for the self-billed invoice. Note: This value is a set of numeric characters.'
          example: '86067000000093112'
        entity_type:
          type: string
          example: self_billed_invoice
          description: 'Must be set to <code>self_billed_invoice</code>. Allowed values: <code>bill</code>, <code>self_billed_invoice</code>.'
        tax_treatment:
          type: string
          example: vat_registered
          description: VAT treatment of the vendor. Allowed values include <code>vat_registered</code>, <code>vat_not_registered</code>, <code>gcc_vat_not_registered</code>, <code>gcc_vat_registered</code>, and <code>non_gcc</code>. <br/><b>For UAE Edition:</b> also <code>dz_vat_registered</code>, <code>dz_vat_not_registered</code>, <code>out_of_scope</code>, <code>gcc_non_vat</code>, <code>fz_vat_registered</code>, and <code>fz_vat_not_registered</code>.
          x-node_available_in:
            - uae
            - gcc
        place_of_supply:
          type: string
          example: DU
          description: Place where the goods or services are supplied. Use the supported state, emirate, or country code for the organization edition.
          x-node_available_in:
            - uae
        tax_reg_no:
          type: string
          example: '100200441040003'
          description: Tax Registration Number (TRN) of the vendor.
          x-node_available_in:
            - uae
        registration_details:
          type: object
          description: Registration details of the vendor. Includes buyer identification, tax registration, and legal information used for E-Invoicing.
          x-node_available_in:
            - uae
          properties:
            company_registration_no:
              type: string
              maxLength: 200
              description: 'Company registration number (Commercial Registration number). Maximum length: 200 characters.'
              example: '1002004410'
            einvoice_identifier_label:
              type: string
              maxLength: 200
              description: 'Label for the buyer identifier used in E-Invoicing (Buyer ID label). Allowed values: <code>TL</code>, <code>EID</code>, <code>PAS</code>, <code>CD</code>. Maximum length: 200 characters.'
              example: EID
            einvoice_identifier_value:
              type: string
              maxLength: 200
              description: 'Value of the buyer identifier used in E-Invoicing (Buyer ID value). Maximum length: 200 characters.'
              example: '234324'
            additionalfield1:
              type: string
              maxLength: 200
              description: 'Authority or scheme that issued the buyer identifier (Buyer ID authority, for example Department of Economy and Tourism). Maximum length: 200 characters.'
              example: Department of Economy and Tourism
            legal_name:
              type: string
              maxLength: 500
              description: 'Legal registered name of the vendor. Maximum length: 500 characters.'
              example: Zylker Trading LLC
            electronic_address_value:
              type: string
              maxLength: 200
              description: 'Electronic address (Peppol ID or similar) of the vendor used for E-Invoicing routing. Maximum length: 200 characters.'
              example: '0088:1234567890123'
        permit_number:
          type: string
          description: Customs or import permit number.
          example: ''
        billing_address_id:
          type: string
          description: 'Unique identifier of the billing address for the vendor. Note: This value is a set of numeric characters.'
          example: '86067000000227075'
        recurring_bill_id:
          type: string
          description: 'Unique identifier of the recurring bill profile linked to this invoice. Note: This value is a set of numeric characters.'
          example: ''
        tags:
          type: array
          description: List of tags to associate with the self-billed invoice.
          items:
            type: object
            properties:
              tag_id:
                type: string
                description: 'Unique identifier of the reporting tag. Note: This value is a set of numeric characters.'
                example: '86067000000001400'
              tag_option_id:
                type: string
                description: 'Unique identifier of the selected tag option. Note: This value is a set of numeric characters.'
                example: '86067000000001401'
        custom_fields:
          type: array
          description: List of custom fields for the self-billed invoice.
          items:
            type: object
            properties:
              custom_field_id:
                type: string
                description: 'Unique identifier of the custom field. Note: This value is a set of numeric characters.'
                example: '86067000000072002'
              value:
                type: string
                description: Value of the custom field.
                example: Warehouse A
        documents:
          type: array
          description: List of documents attached to the self-billed invoice.
          items:
            type: object
            properties:
              document_id:
                type: string
                description: 'Unique identifier of the attached document. Note: This value is a set of numeric characters.'
                example: '86067000000080001'
              file_name:
                type: string
                description: File name of the attached document.
                example: vendor-invoice.pdf
        line_items:
          type: array
          description: List of line items in the self-billed invoice.
          items:
            type: object
            properties:
              item_id:
                type: string
                description: 'Unique identifier of the item. Note: This value is a set of numeric characters.'
                example: '86067000000120060'
              name:
                type: string
                description: 'Name of the line item. Maximum length: 200 characters.'
                example: Airpod stand
                maxLength: 200
              account_id:
                type: string
                description: 'Unique identifier of the expense account for the line item. Note: This value is a set of numeric characters.'
                example: '86067000000034003'
              description:
                type: string
                description: 'Description of the line item. Maximum length: 6000 characters.'
                example: Airpod stand
                maxLength: 6000
              rate:
                type: number
                description: Unit price of the item.
                example: 400
              quantity:
                type: number
                description: Quantity of the item.
                example: 1
              discount:
                type: number
                description: Discount percentage or amount applied to the line item.
                example: 0
              tax_id:
                type: string
                description: 'Unique identifier of the tax applied to the line item. Note: This value is a set of numeric characters.'
                example: '86067000000093150'
              reverse_charge_tax_id:
                type: string
                description: 'Unique identifier of the reverse charge tax for the line item. Note: This value is a set of numeric characters.'
                example: ''
              unit:
                type: string
                description: Unit of measurement for the item (e.g., kg, pcs).
                example: ''
              item_order:
                type: integer
                description: Display order of the line item.
                example: 1
              is_billable:
                type: boolean
                description: Set to <code>true</code> if the line item is billable to a customer.
                example: false
              customer_id:
                type: string
                description: 'Unique identifier of the customer to bill, if the line item is billable. Note: This value is a set of numeric characters.'
                example: ''
              project_id:
                type: string
                description: 'Unique identifier of the project associated with the line item. Note: This value is a set of numeric characters.'
                example: ''
              hsn_or_sac:
                type: string
                example: '1034'
                description: HSN or SAC code for the line item.
                x-node_available_in:
                  - uae
              unitkey_code:
                type: string
                example: H87
                description: 'UN/CEFACT unit code for the line item. Maximum length: 10 characters.'
                maxLength: 10
                x-node_available_in:
                  - uae
              product_type:
                type: string
                example: goods
                description: 'The product or service type the line item belongs to. Allowed values: <code>goods</code> or <code>service</code>.'
                x-node_available_in:
                  - uae
              tax_treatment_code:
                type: string
                description: Tax treatment reason code for the line item.
                example: ''
                x-node_available_in:
                  - uae
              tags:
                type: array
                description: List of tags for the line item.
                items:
                  type: object
                  properties:
                    tag_id:
                      type: string
                      description: 'Unique identifier of the reporting tag. Note: This value is a set of numeric characters.'
                      example: '86067000000001400'
                    tag_option_id:
                      type: string
                      description: 'Unique identifier of the selected tag option. Note: This value is a set of numeric characters.'
                      example: '86067000000001401'
              item_custom_fields:
                type: array
                description: List of custom fields for the line item.
                items:
                  type: object
                  properties:
                    custom_field_id:
                      type: string
                      description: 'Unique identifier of the custom field. Note: This value is a set of numeric characters.'
                      example: '86067000000072003'
                    value:
                      type: string
                      description: Value of the custom field.
                      example: '2'
